<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestor Docente</title>
  <meta name="description" content="Gestão da carreira docente: atividades, comprovantes, orientandos, produção e dossiê de progressão.">
  <meta name="theme-color" content="#1F5C4E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gestor Docente">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>Gestor Docente</span>
    </div>
    <button id="syncBtn" class="sync" type="button" data-act="sync" aria-live="polite">
      <span class="dot" id="syncDot"></span><span id="syncLabel">Local</span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" data-act="novo" aria-label="Registrar atividade">+</button>

  <nav class="tabbar" aria-label="Seções">
    <a href="#inicio" data-tab="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
    <a href="#atividades" data-tab="atividades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>Atividades</span></a>
    <a href="#orientandos" data-tab="orientandos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2M16 5.5a3 3 0 0 1 0 5.6M18 14.6c1.7.6 2.7 2.4 3 5.4"/></svg><span>Orientandos</span></a>
    <a href="#dossie" data-tab="dossie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6l2 2h8v11H4z"/></svg><span>Dossiê</span></a>
    <a href="#mais" data-tab="mais"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Mais</span></a>
  </nav>

  <dialog id="modal" aria-labelledby="modalTitle">
    <form id="modalForm" method="dialog" novalidate>
      <div class="modal-head">
        <h2 id="modalTitle">Registro</h2>
        <button type="button" class="icon-btn" data-act="fechar" aria-label="Fechar">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn ghost danger" id="btnExcluir" data-act="excluir">Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-act="fechar">Cancelar</button>
        <button type="submit" class="btn primary" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="fileComprovante" accept="image/*,application/pdf" hidden>
  <input type="file" id="fileBackup" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://accounts.google.com/gsi/client" async defer onload="window.__gisLoaded && window.__gisLoaded()"></script>
  <script src="app.js"></script>
</body>
</html>
